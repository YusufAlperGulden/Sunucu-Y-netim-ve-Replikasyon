services:
  # Web Servisi
  - type: web
    name: universal-server-manager-web
    env: python
    rootDir: fastapi_app
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    preDeployCommand: "python -m alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VAULT_KEY
        sync: false

  # Background Worker Servisi
  - type: worker
    name: universal-server-manager-worker
    env: python
    rootDir: fastapi_app
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python worker.py"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VAULT_KEY
        sync: false
